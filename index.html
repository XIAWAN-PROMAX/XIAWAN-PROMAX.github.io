<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瞎玩的博客主页</title>
    <style>
        :root {
            --bg-deep: #080d18;
            --bg-card: rgba(18, 26, 42, 0.55);
            --cyan: #00c6d7;
            --cyan-light: #5ce0ec;
            --blue: #2b8ce4;
            --blue-light: #5babf5;
            --teal: #0dc9b5;
            --text-primary: #e8edf5;
            --text-secondary: #a0b4cc;
            --text-muted: #6b7d95;
            --shadow-glow: 0 0 60px rgba(0, 180, 210, 0.25);
            --shadow-glow-strong: 0 0 100px rgba(0, 190, 220, 0.35);
            --border-subtle: rgba(140, 200, 230, 0.2);
            --border-glow: rgba(100, 200, 230, 0.45);
            --border-angle: 0deg;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-deep);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            cursor: default;
        }

        /* 背景网格 */
        .bg-grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                linear-gradient(rgba(30, 50, 70, 0.25) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 50, 70, 0.25) 1px, transparent 1px);
            background-size: 52px 52px;
            -webkit-mask-image: radial-gradient(ellipse 65% 55% at 50% 50%, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.05) 70%, transparent 100%);
            mask-image: radial-gradient(ellipse 65% 55% at 50% 50%, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.05) 70%, transparent 100%);
        }

        /* Canvas 粒子层 */
        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* 背景光晕 */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
            animation: orbDrift 18s ease-in-out infinite;
        }
        .bg-orb.orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 180, 200, 0.5) 0%, transparent 70%);
            top: -15%;
            left: 10%;
            animation-delay: 0s;
            animation-duration: 20s;
        }
        .bg-orb.orb-2 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(10, 160, 180, 0.4) 0%, transparent 70%);
            bottom: -18%;
            right: 5%;
            animation-delay: -8s;
            animation-duration: 22s;
        }
        .bg-orb.orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(30, 140, 200, 0.35) 0%, transparent 70%);
            top: 40%;
            left: 55%;
            animation-delay: -14s;
            animation-duration: 24s;
        }

        @keyframes orbDrift {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            15% {
                transform: translate(6%, -4%) scale(1.08);
            }
            30% {
                transform: translate(-3%, 7%) scale(0.94);
            }
            45% {
                transform: translate(-7%, -3%) scale(1.05);
            }
            60% {
                transform: translate(4%, 5%) scale(0.96);
            }
            75% {
                transform: translate(8%, -6%) scale(1.03);
            }
            90% {
                transform: translate(-5%, 2%) scale(0.98);
            }
        }

        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 10;
            perspective: 1000px;
        }

        /* 液态玻璃窗口卡片 */
        .glass-window {
            position: relative;
            width: 520px;
            max-width: 92vw;
            border-radius: 20px;
            background: var(--bg-card);
            backdrop-filter: blur(28px) saturate(170%);
            -webkit-backdrop-filter: blur(28px) saturate(170%);
            border: 1px solid var(--border-subtle);
            box-shadow:
                var(--shadow-glow),
                0 8px 40px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                inset 0 -2px 0 rgba(0, 0, 0, 0.2);
            overflow: visible;
            transition: box-shadow 0.6s ease, border-color 0.6s ease;
            animation: cardBreathe 7s ease-in-out infinite;
            will-change: transform;
        }

        .glass-window:hover {
            box-shadow:
                var(--shadow-glow-strong),
                0 12px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                inset 0 -2px 0 rgba(0, 0, 0, 0.2);
            border-color: var(--border-glow);
        }

        @keyframes cardBreathe {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }
            25% {
                transform: translateY(-4px) scale(1.004);
            }
            50% {
                transform: translateY(-1px) scale(1.001);
            }
            75% {
                transform: translateY(-5px) scale(1.005);
            }
        }

        /* 流动边框光效 - 使用伪元素 + JS驱动旋转 */
        .glass-window::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            padding: 2px;
            background: conic-gradient(from var(--border-angle),
                    transparent 0%,
                    rgba(0, 200, 215, 0) 15%,
                    rgba(0, 200, 215, 0.7) 25%,
                    rgba(60, 180, 225, 0.8) 35%,
                    rgba(0, 200, 215, 0.7) 45%,
                    rgba(0, 200, 215, 0) 55%,
                    transparent 60%,
                    rgba(20, 170, 210, 0) 70%,
                    rgba(20, 170, 210, 0.6) 78%,
                    rgba(60, 190, 220, 0.7) 85%,
                    rgba(20, 170, 210, 0) 92%,
                    transparent 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            z-index: -1;
            pointer-events: none;
        }

        /* SVG 液态纹理覆盖层 */
        .liquid-overlay {
            position: absolute;
            inset: 0;
            border-radius: 20px;
            pointer-events: none;
            z-index: 2;
            opacity: 0.16;
            mix-blend-mode: soft-light;
            filter: url(#liquidFilter);
            -webkit-filter: url(#liquidFilter);
            overflow: hidden;
        }

        /* 第二层液态光泽 */
        .liquid-highlight {
            position: absolute;
            inset: 8px;
            border-radius: 14px;
            pointer-events: none;
            z-index: 3;
            opacity: 0.07;
            mix-blend-mode: overlay;
            filter: url(#liquidFilter2);
            -webkit-filter: url(#liquidFilter2);
            overflow: hidden;
        }

        /* 窗口标题栏 */
        .window-titlebar {
            display: flex;
            align-items: center;
            padding: 16px 20px 10px 20px;
            position: relative;
            z-index: 5;
            gap: 10px;
        }
        .window-dots {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .window-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 6px currentColor;
        }
        .window-dot.dot-close {
            background: #f8716b;
            color: #f8716b;
            box-shadow: 0 0 8px rgba(248, 113, 107, 0.5);
        }
        .window-dot.dot-min {
            background: #f5c542;
            color: #f5c542;
            box-shadow: 0 0 8px rgba(245, 197, 66, 0.5);
        }
        .window-dot.dot-max {
            background: #5cdb9e;
            color: #5cdb9e;
            box-shadow: 0 0 8px rgba(92, 219, 158, 0.5);
        }
        .window-dot:hover {
            transform: scale(1.35);
            filter: brightness(1.3);
        }
        .window-dot:active {
            transform: scale(0.9);
            filter: brightness(0.8);
        }
        .window-title-text {
            flex: 1;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            font-weight: 500;
            user-select: none;
            white-space: nowrap;
            opacity: 0.7;
        }

        /* 卡片内容 */
        .card-body {
            position: relative;
            z-index: 5;
            padding: 0 28px 28px 28px;
        }
        .blog-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 1.2px;
            margin-bottom: 6px;
            text-align: center;
            text-shadow: 0 0 30px rgba(180, 220, 240, 0.3);
            line-height: 1.3;
        }
        .blog-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            letter-spacing: 0.8px;
            font-weight: 400;
            margin-bottom: 22px;
            opacity: 0.75;
        }
        .divider {
            height: 1px;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(140, 200, 225, 0.35) 20%,
                    rgba(140, 200, 225, 0.55) 50%,
                    rgba(140, 200, 225, 0.35) 80%,
                    transparent 100%);
            margin-bottom: 22px;
            border: none;
        }
        .info-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.025);
            margin-bottom: 10px;
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 0.4px;
            transition: background 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .info-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .info-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--teal);
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(13, 201, 181, 0.6);
            animation: dotPulse 3s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%,
            100% {
                box-shadow: 0 0 6px rgba(13, 201, 181, 0.5);
            }
            50% {
                box-shadow: 0 0 14px rgba(13, 201, 181, 0.9);
            }
        }
        .info-label {
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            flex-shrink: 0;
        }

        /* 下载按钮 */
        .download-section {
            margin-top: 18px;
            text-align: center;
        }
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 13px 28px;
            border-radius: 30px;
            background: rgba(0, 180, 200, 0.12);
            border: 1px solid rgba(0, 190, 210, 0.4);
            color: #c8eef5;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 0 20px rgba(0, 180, 200, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .download-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 30px;
            background: linear-gradient(135deg,
                    rgba(0, 210, 230, 0.25) 0%,
                    transparent 40%,
                    transparent 60%,
                    rgba(0, 200, 220, 0.2) 100%);
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
        }
        .download-btn:hover {
            background: rgba(0, 190, 210, 0.2);
            border-color: rgba(0, 210, 230, 0.7);
            box-shadow: 0 0 35px rgba(0, 190, 215, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            color: #fff;
            transform: translateY(-2px);
            letter-spacing: 1.2px;
        }
        .download-btn:hover::after {
            opacity: 1;
        }
        .download-btn:active {
            transform: scale(0.96);
            transition: all 0.1s ease;
            box-shadow: 0 0 15px rgba(0, 180, 200, 0.3);
        }
        .download-icon-svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            transition: transform 0.35s ease;
        }
        .download-btn:hover .download-icon-svg {
            transform: translateY(2px);
        }
        .download-url-hint {
            display: block;
            margin-top: 8px;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            opacity: 0.5;
            word-break: break-all;
            text-align: center;
        }

        /* 卡片底部微光 */
        .card-bottom-glow {
            position: absolute;
            bottom: -2px;
            left: 15%;
            right: 15%;
            height: 1px;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(0, 200, 220, 0.5) 30%,
                    rgba(0, 200, 220, 0.7) 50%,
                    rgba(0, 200, 220, 0.5) 70%,
                    transparent);
            z-index: 6;
            pointer-events: none;
            border-radius: 0 0 20px 20px;
            animation: bottomGlowPulse 4s ease-in-out infinite;
        }
        @keyframes bottomGlowPulse {
            0%,
            100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        /* ========== 弹窗样式 ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(4, 10, 20, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            cursor: default;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-dialog {
            position: relative;
            width: 400px;
            max-width: 90vw;
            background: rgba(15, 28, 45, 0.75);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-radius: 20px;
            border: 1px solid rgba(100, 200, 230, 0.25);
            box-shadow: 0 0 80px rgba(0, 180, 210, 0.35), 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            padding: 28px 24px 22px;
            text-align: center;
            transform: translateY(20px) scale(0.96);
            transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            z-index: 1001;
        }
        .modal-overlay.active .modal-dialog {
            transform: translateY(0) scale(1);
        }

        .modal-dialog::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 21px;
            padding: 1px;
            background: conic-gradient(from var(--border-angle),
                    transparent,
                    rgba(0, 200, 215, 0.5) 25%,
                    rgba(0, 200, 215, 0.7) 50%,
                    rgba(0, 200, 215, 0.5) 75%,
                    transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            z-index: -1;
            pointer-events: none;
        }

        .modal-message {
            color: #d0e6f0;
            font-size: 15px;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 24px;
            letter-spacing: 0.4px;
            padding: 0 10px;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .modal-btn {
            padding: 10px 24px;
            border-radius: 26px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.6px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #c8eef5;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            outline: none;
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }
        .modal-btn:hover {
            background: rgba(0, 190, 210, 0.2);
            border-color: rgba(0, 210, 230, 0.6);
            box-shadow: 0 0 20px rgba(0, 190, 215, 0.4);
            color: #fff;
            transform: translateY(-1px);
        }
        .modal-btn.primary {
            background: rgba(0, 180, 200, 0.18);
            border-color: rgba(0, 200, 220, 0.5);
            box-shadow: 0 0 18px rgba(0, 180, 200, 0.3);
        }
        .modal-btn.primary:hover {
            background: rgba(0, 200, 220, 0.25);
            border-color: rgba(0, 220, 240, 0.7);
            box-shadow: 0 0 28px rgba(0, 200, 220, 0.45);
        }

        /* 响应式微调 */
        @media (max-width: 560px) {
            .glass-window {
                width: 94vw;
                border-radius: 16px;
            }
            .glass-window::before {
                border-radius: 18px;
            }
            .liquid-overlay {
                border-radius: 16px;
            }
            .liquid-highlight {
                border-radius: 10px;
                inset: 5px;
            }
            .blog-title {
                font-size: 22px;
                letter-spacing: 0.8px;
            }
            .card-body {
                padding: 0 18px 22px 18px;
            }
            .window-titlebar {
                padding: 12px 14px 8px 14px;
            }
            .window-dot {
                width: 9px;
                height: 9px;
            }
            .window-dots {
                gap: 6px;
            }
            .download-btn {
                padding: 11px 22px;
                font-size: 13px;
                border-radius: 26px;
            }
            .download-btn::after {
                border-radius: 26px;
            }
            .blog-subtitle {
                font-size: 11px;
                margin-bottom: 16px;
            }
            .info-row {
                font-size: 11px;
                padding: 8px 10px;
                gap: 6px;
            }
            .modal-dialog {
                padding: 22px 18px 18px;
            }
            .modal-message {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- 背景光晕 -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <!-- 背景网格 -->
    <div class="bg-grid"></div>

    <!-- 粒子画布 -->
    <canvas id="particleCanvas"></canvas>

    <!-- SVG 滤镜定义（必须可见才能生效） -->
    <svg style="position:absolute;width:0;height:0;pointer-events:none;" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="liquidFilter" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence
                id="liquidTurbulence"
                type="fractalNoise"
                baseFrequency="0.022"
                numOctaves="4"
                seed="42"
                result="noise"
                />
                <feDisplacementMap
                in="SourceGraphic"
                in2="noise"
                scale="18"
                xChannelSelector="R"
                yChannelSelector="G"
                result="displaced"
                />
                <feColorMatrix
                in="noise"
                type="matrix"
                values="
                0 0 0 0 0.05
                0 0 0 0 0.72
                0 0 0 0 0.82
                0 0 0 0.35 0
                "
                result="coloredNoise"
                />
                <feComposite
                in="displaced"
                in2="coloredNoise"
                operator="in"
                result="masked"
                />
                <feGaussianBlur in="masked" stdDeviation="2.5" result="blurred" />
                <feBlend in="SourceGraphic" in2="blurred" mode="soft-light" />
            </filter>

            <filter id="liquidFilter2" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence
                id="liquidTurbulence2"
                type="fractalNoise"
                baseFrequency="0.028"
                numOctaves="3"
                seed="117"
                result="noise2"
                />
                <feDisplacementMap
                in="SourceGraphic"
                in2="noise2"
                scale="10"
                xChannelSelector="R"
                yChannelSelector="B"
                result="displaced2"
                />
                <feColorMatrix
                in="noise2"
                type="matrix"
                values="
                0 0 0 0 0.15
                0 0 0 0 0.85
                0 0 0 0 0.95
                0 0 0 0.18 0
                "
                result="coloredNoise2"
                />
                <feComposite in="displaced2" in2="coloredNoise2" operator="in" result="masked2" />
                <feGaussianBlur in="masked2" stdDeviation="1.8" result="blurred2" />
                <feBlend in="SourceGraphic" in2="blurred2" mode="overlay" />
            </filter>
        </defs>
    </svg>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 液态玻璃窗口卡片 -->
        <div class="glass-window" id="glassWindow">
            <div class="liquid-overlay"></div>
            <div class="liquid-highlight"></div>

            <div class="window-titlebar">
                <div class="window-dots">
                    <span class="window-dot dot-close" title="关闭"></span>
                    <span class="window-dot dot-min" title="最小化"></span>
                    <span class="window-dot dot-max" title="最大化"></span>
                </div>
                <span class="window-title-text">瞎玩的博客主页</span>
            </div>

            <div class="card-body">
                <h1 class="blog-title">瞎玩的博客主页</h1>
                <p class="blog-subtitle">一个随便折腾的地方 · 记录些有的没的</p>
                <hr class="divider" />
                <div class="info-row">
                    <span class="info-dot"></span>
                    <span class="info-label">状态</span>
                    <span>在线瞎玩中</span>
                </div>
                <div class="info-row">
                    <span class="info-dot" style="background:#5babf5;box-shadow:0 0 8px rgba(91,171,245,0.6);"></span>
                    <span class="info-label">更新</span>
                    <span>不定时诈尸式更新</span>
                </div>
                <div class="download-section">
                    <a href="#" class="download-btn" id="downloadTriggerBtn" title="下载文件">
                        <svg class="download-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        下载文件
                    </a>
                    <span class="download-url-hint">qfile.qq.com/q/vDOLQEVIfS</span>
                </div>
            </div>
            <div class="card-bottom-glow"></div>
        </div>
    </div>

    <!-- 弹窗 (确认对话框) -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-dialog">
            <div class="modal-message">
                不保证所有应用可使用<br>仅限安卓&nbsp;&nbsp;苹果不可用<br>不要到时候再来私信问我!
            </div>
            <div class="modal-buttons">
                <button class="modal-btn" id="modalCancelBtn" type="button">取消</button>
                <button class="modal-btn primary" id="modalDownloadBtn" type="button">立即下载</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // 下载链接
            const downloadUrl = 'https://qfile.qq.com/q/vDOLQEVIfS';

            // ============ 获取关键 DOM 元素 ============
            const glassWindow = document.getElementById('glassWindow');
            const root = document.documentElement;

            // ============ 驱动 --border-angle 的动画循环 ============
            let borderAngle = 0;
            const borderAngleSpeed = 1.2; // 每帧旋转度数（约60fps下每秒72度）

            function updateBorderAngle() {
                borderAngle = (borderAngle + borderAngleSpeed) % 360;
                root.style.setProperty('--border-angle', borderAngle + 'deg');
            }

            // ============ Canvas 粒子系统 ============
            const canvas = document.getElementById('particleCanvas');
            if (!canvas) {
                console.error('粒子画布未找到');
                return;
            }
            const ctx = canvas.getContext('2d');
            let width, height;
            const particles = [];
            const PARTICLE_COUNT = 55;

            function resizeCanvas() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', () => {
                resizeCanvas();
                particles.forEach(p => {
                    p.x = Math.random() * width;
                    p.y = Math.random() * height;
                });
            });

            class Particle {
                constructor() {
                    this.reset(true);
                }
                reset(initial = false) {
                    this.x = initial ? Math.random() * width : (Math.random() < 0.5 ? -30 : width + 30);
                    this.y = initial ? Math.random() * height : Math.random() * height;
                    this.size = Math.random() * 1.6 + 0.5;
                    this.speedX = (Math.random() - 0.5) * 0.25;
                    this.speedY = (Math.random() - 0.5) * 0.3 - 0.15;
                    this.opacity = Math.random() * 0.5 + 0.2;
                    this.pulseSpeed = Math.random() * 0.015 + 0.005;
                    this.pulseOffset = Math.random() * Math.PI * 2;
                    this.hue = Math.random() < 0.5 ? 188 + Math.random() * 20 : 195 + Math.random() * 25;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < -40) this.x = width + 30;
                    if (this.x > width + 40) this.x = -30;
                    if (this.y < -40) this.y = height + 30;
                    if (this.y > height + 40) this.y = -30;
                }
                draw(ctx, time) {
                    const pulse = Math.sin(time * this.pulseSpeed + this.pulseOffset) * 0.3 + 0.7;
                    const alpha = this.opacity * pulse;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3.5);
                    glow.addColorStop(0, `hsla(${this.hue}, 80%, 65%, ${alpha})`);
                    glow.addColorStop(0.4, `hsla(${this.hue}, 70%, 55%, ${alpha * 0.5})`);
                    glow.addColorStop(1, `hsla(${this.hue}, 60%, 45%, 0)`);
                    ctx.fillStyle = glow;
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue}, 50%, 85%, ${alpha * 0.9})`;
                    ctx.fill();
                }
            }

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }

            // ============ SVG 液态滤镜实时渲染 ============
            const turbulence1 = document.getElementById('liquidTurbulence');
            const turbulence2 = document.getElementById('liquidTurbulence2');
            let seed1 = 42;
            let seed2 = 117;

            function updateLiquidFilters(time) {
                if (!turbulence1 || !turbulence2) return;
                const wave1 = Math.sin(time * 0.0004) * 0.004;
                const wave2 = Math.cos(time * 0.00035) * 0.005;
                const bf1 = 0.022 + wave1;
                const bf2 = 0.028 + wave2;
                turbulence1.setAttribute('baseFrequency', bf1.toFixed(5));
                turbulence2.setAttribute('baseFrequency', bf2.toFixed(5));
                seed1 = (seed1 + 0.07) % 10000;
                seed2 = (seed2 + 0.053) % 10000;
                turbulence1.setAttribute('seed', Math.floor(seed1));
                turbulence2.setAttribute('seed', Math.floor(seed2));
            }

            // ============ 统一动画循环 ============
            let animationId;

            function animate(timestamp) {
                const time = timestamp || performance.now();

                // 更新边框角度
                updateBorderAngle();

                // 更新粒子
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    p.update();
                    p.draw(ctx, time);
                });
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 100) {
                            const alpha = (1 - dist / 100) * 0.08;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(120,200,220,${alpha})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }

                // 更新液态滤镜
                updateLiquidFilters(time);

                animationId = requestAnimationFrame(animate);
            }
            animationId = requestAnimationFrame(animate);

            window.addEventListener('beforeunload', () => {
                if (animationId) cancelAnimationFrame(animationId);
            });

            // ============ 窗口控制按钮交互 ============
            const dotClose = document.querySelector('.dot-close');
            const dotMin = document.querySelector('.dot-min');
            const dotMax = document.querySelector('.dot-max');

            if (dotClose) {
                dotClose.addEventListener('click', (e) => {
                    e.stopPropagation();
                    glassWindow.style.transition = 'all 0.35s cubic-bezier(0.6, 0, 1, 0.75)';
                    glassWindow.style.opacity = '0';
                    glassWindow.style.transform = 'scale(0.92) translateY(20px)';
                    glassWindow.style.filter = 'blur(8px)';
                    setTimeout(() => {
                        glassWindow.style.transition = 'all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1.2)';
                        glassWindow.style.opacity = '1';
                        glassWindow.style.transform = '';
                        glassWindow.style.filter = '';
                    }, 600);
                });
            }

            if (dotMin) {
                dotMin.addEventListener('click', (e) => {
                    e.stopPropagation();
                    glassWindow.style.transition = 'all 0.4s cubic-bezier(0.6, 0, 1, 0.75)';
                    glassWindow.style.transform = 'scale(0.85) translateY(40px)';
                    glassWindow.style.opacity = '0.3';
                    setTimeout(() => {
                        glassWindow.style.transition = 'all 0.55s cubic-bezier(0.25, 0.8, 0.25, 1.2)';
                        glassWindow.style.transform = '';
                        glassWindow.style.opacity = '1';
                    }, 500);
                });
            }

            if (dotMax) {
                dotMax.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const currentWidth = glassWindow.offsetWidth;
                    const maxWidth = Math.min(window.innerWidth * 0.96, 680);
                    if (currentWidth < maxWidth - 20) {
                        glassWindow.style.transition = 'all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1.2)';
                        glassWindow.style.width = maxWidth + 'px';
                    } else {
                        glassWindow.style.transition = 'all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1.2)';
                        glassWindow.style.width = '520px';
                    }
                    setTimeout(() => {
                        glassWindow.style.width = '';
                    }, 600);
                });
            }

            // ============ 弹窗逻辑 ============
            const modalOverlay = document.getElementById('confirmModal');
            const modalCancelBtn = document.getElementById('modalCancelBtn');
            const modalDownloadBtn = document.getElementById('modalDownloadBtn');
            const downloadTriggerBtn = document.getElementById('downloadTriggerBtn');

            if (!modalOverlay || !modalCancelBtn || !modalDownloadBtn || !downloadTriggerBtn) {
                console.warn('弹窗相关元素未找到，但页面仍可运行');
            }

            function openModal() {
                if (modalOverlay) modalOverlay.classList.add('active');
            }

            function closeModal() {
                if (modalOverlay) modalOverlay.classList.remove('active');
            }

            if (downloadTriggerBtn) {
                downloadTriggerBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    openModal();
                });
            }

            if (modalCancelBtn) {
                modalCancelBtn.addEventListener('click', closeModal);
            }

            if (modalOverlay) {
                modalOverlay.addEventListener('click', (e) => {
                    if (e.target === modalOverlay) {
                        closeModal();
                    }
                });
            }

            if (modalDownloadBtn) {
                modalDownloadBtn.addEventListener('click', () => {
                    window.open(downloadUrl, '_blank', 'noopener');
                    closeModal();
                });
            }

            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modalOverlay && modalOverlay.classList.contains('active')) {
                    closeModal();
                }
            });

            // ============ 鼠标视差微动效果 ============
            document.addEventListener('mousemove', (e) => {
                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 2;
                const dx = (e.clientX - cx) / cx;
                const dy = (e.clientY - cy) / cy;
                const rotateX = dy * -3;
                const rotateY = dx * 3;
                glassWindow.style.transform =
                    `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(${Math.abs(dy)* -4}px)`;
            });

            document.addEventListener('mouseleave', () => {
                glassWindow.style.transition = 'transform 1.2s cubic-bezier(0.25, 0.8, 0.25, 1)';
                glassWindow.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0)';
                setTimeout(() => {
                    glassWindow.style.transition = '';
                }, 1200);
            });

            console.log('%c 瞎玩的博客主页 %c已就绪',
                'font-size:16px;color:#5ce0ec;font-weight:bold;',
                'font-size:12px;color:#a0b4cc;');
            console.log('%c液态玻璃效果实时渲染中...',
                'color:#8cc8de;');
            console.log('%c点击下载按钮会弹出确认提示', 'color:#a0b4cc;');
        })();
    </script>
</body>
</html>
