apply plugin: 'com.android.application'

android {
    namespace 'com.flash.recorder'
    compileSdk 34

    defaultConfig {
        applicationId "com.flash.recorder"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        releaseSigning {
            storeFile file("${System.getProperty('user.home')}/.android/flash-release.keystore")
            storePassword "flash123"
            keyAlias "flash"
            keyPassword "flash123"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.releaseSigning
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'
}
